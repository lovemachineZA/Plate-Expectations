const SHEET_RECIPES = 'Recipes';
const SHEET_PANTRY = 'Pantry';
const SHEET_MEALPLAN = 'MealPlan';
const SHEET_GROCERY = 'GroceryList';

function doGet(e) {
  try {
    const ss = SpreadsheetApp.getActiveSpreadsheet();
    ensureTablesExist(ss);

    const recipes = getTableData(ss.getSheetByName(SHEET_RECIPES));
    const pantry = getTableData(ss.getSheetByName(SHEET_PANTRY));
    const mealPlan = getTableData(ss.getSheetByName(SHEET_MEALPLAN));
    const groceryList = getTableData(ss.getSheetByName(SHEET_GROCERY));

    const response = {
      status: 'success',
      timestamp: new Date().toISOString(),
      data: {
        recipes: recipes,
        pantry: pantry,
        mealPlan: mealPlan,
        groceryList: groceryList
      }
    };

    return ContentService.createTextOutput(JSON.stringify(response))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({
      status: 'error',
      message: err.toString()
    })).setMimeType(ContentService.MimeType.JSON);
  }
}

function doPost(e) {
  const lock = LockService.getScriptLock();
  try {
    const success = lock.tryLock(10000);
    if (!success) {
      return ContentService.createTextOutput(JSON.stringify({
        status: 'error',
        message: 'Could not obtain lock, concurrent write in progress.'
      })).setMimeType(ContentService.MimeType.JSON);
    }

    const contents = e.postData ? JSON.parse(e.postData.contents) : {};
    const action = contents.action || 'SYNC_ALL';
    const payload = contents.payload || {};
    const ss = SpreadsheetApp.getActiveSpreadsheet();
    ensureTablesExist(ss);

    if (action === 'SYNC_ALL') {
      if (payload.recipes) saveTableData(ss.getSheetByName(SHEET_RECIPES), payload.recipes);
      if (payload.pantry) saveTableData(ss.getSheetByName(SHEET_PANTRY), payload.pantry);
      if (payload.mealPlan) saveTableData(ss.getSheetByName(SHEET_MEALPLAN), payload.mealPlan);
      if (payload.groceryList) saveTableData(ss.getSheetByName(SHEET_GROCERY), payload.groceryList);
    } else if (action === 'UPDATE_RECIPE') {
      updateSingleRow(ss.getSheetByName(SHEET_RECIPES), payload.recipe, 'ID');
    } else if (action === 'UPDATE_PANTRY') {
      updateSingleRow(ss.getSheetByName(SHEET_PANTRY), payload.pantryItem, 'ID');
    } else if (action === 'UPDATE_MEALPLAN') {
      updateSingleRow(ss.getSheetByName(SHEET_MEALPLAN), payload.mealPlanDay, 'DayOfWeek');
    }

    return ContentService.createTextOutput(JSON.stringify({
      status: 'success',
      serverTime: new Date().toISOString()
    })).setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({
      status: 'error',
      message: err.toString()
    })).setMimeType(ContentService.MimeType.JSON);
  } finally {
    lock.releaseLock();
  }
}

function getTableData(sheet) {
  const data = sheet.getDataRange().getValues();
  if (data.length <= 1) return [];
  const headers = data[0];
  const rows = [];
  for (let i = 1; i < data.length; i++) {
    const rowObj = {};
    for (let j = 0; j < headers.length; j++) {
      rowObj[headers[j]] = data[i][j];
    }
    rows.push(rowObj);
  }
  return rows;
}

function saveTableData(sheet, items) {
  if (!items || !items.length) return;
  const headers = Object.keys(items[0]);
  sheet.clearContents();
  sheet.appendRow(headers);
  const rows = items.map(function(item) {
    return headers.map(function(h) {
      let val = item[h];
      if (Array.isArray(val)) return val.join(', ');
      return val !== undefined && val !== null ? val : '';
    });
  });
  if (rows.length > 0) {
    sheet.getRange(2, 1, rows.length, headers.length).setValues(rows);
  }
}

function updateSingleRow(sheet, item, keyName) {
  const data = sheet.getDataRange().getValues();
  if (data.length <= 1) return;
  const headers = data[0];
  const keyIndex = headers.indexOf(keyName);
  if (keyIndex === -1) return;

  const keyValue = item[keyName];
  let foundRow = -1;
  for (let i = 1; i < data.length; i++) {
    if (String(data[i][keyIndex]) === String(keyValue)) {
      foundRow = i + 1;
      break;
    }
  }

  const rowValues = headers.map(function(h) {
    let val = item[h];
    if (Array.isArray(val)) return val.join(', ');
    return val !== undefined && val !== null ? val : '';
  });

  if (foundRow !== -1) {
    sheet.getRange(foundRow, 1, 1, headers.length).setValues([rowValues]);
  } else {
    sheet.appendRow(rowValues);
  }
}

function ensureTablesExist(ss) {
  const required = [
    {
      name: SHEET_RECIPES,
      headers: ['ID', 'Name', 'Ingredients', 'Instructions', 'CookTimeMins', 'Rating_Husband', 'Rating_Wife', 'Tags', 'Notes', 'ImageURL', 'LastCookedDate', 'CreatedBy', 'LastEditedBy', 'LastEditedTimestamp', 'Calories', 'Servings']
    },
    {
      name: SHEET_PANTRY,
      headers: ['ID', 'ItemName', 'Category', 'InStock', 'UseFirst']
    },
    {
      name: SHEET_MEALPLAN,
      headers: ['DayOfWeek', 'DayName', 'Date', 'RecipeID', 'RecipeName', 'AssignedTo', 'IsLeftoverOrOut', 'LeftoverType', 'IsLocked', 'Notes']
    },
    {
      name: SHEET_GROCERY,
      headers: ['ItemName', 'Quantity', 'Category', 'Checked', 'SourceRecipes']
    }
  ];

  required.forEach(function(def) {
    let sheet = ss.getSheetByName(def.name);
    if (!sheet) {
      sheet = ss.insertSheet(def.name);
      sheet.appendRow(def.headers);
      sheet.getRange(1, 1, 1, def.headers.length).setFontWeight('bold').setBackground('#E5E4DE');
    }
  });
}

      { id: 'p-8', itemName: 'Shrimp', category: 'Meat & Seafood', inStock: false, useFirst: false }
    ];

    const DEFAULT_PLAN = [
      { dayOfWeek: 'Mon', dayName: 'Monday', date: '2026-09-14', recipeId: 'rec-1', recipeName: 'Lemon Herb Salmon Bowl', assignedTo: 'Husband', isLocked: true, isLeftoverOrOut: false },
      { dayOfWeek: 'Tue', dayName: 'Tuesday', date: '2026-09-15', recipeId: 'rec-4', recipeName: 'Spicy Morning Shakshuka', assignedTo: 'Wife', isLocked: false, isLeftoverOrOut: false },
      { dayOfWeek: 'Wed', dayName: 'Wednesday', date: '2026-09-16', recipeId: 'rec-5', recipeName: 'Lemon Garlic Shrimp Pasta', assignedTo: 'Together', isLocked: false, isLeftoverOrOut: false },
      { dayOfWeek: 'Thu', dayName: 'Thursday', date: '2026-09-17', recipeId: 'rec-3', recipeName: 'Roasted Veggie Grain Bowl', assignedTo: 'Husband', isLocked: false, isLeftoverOrOut: false },
      { dayOfWeek: 'Fri', dayName: 'Friday', date: '2026-09-18', recipeId: 'rec-1', recipeName: 'Lemon Herb Salmon Bowl', assignedTo: 'Wife', isLocked: false, isLeftoverOrOut: false },
      { dayOfWeek: 'Sat', dayName: 'Saturday', date: '2026-09-19', recipeId: 'rec-5', recipeName: 'Lemon Garlic Shrimp Pasta', assignedTo: 'Husband', isLocked: true, isLeftoverOrOut: false },
      { dayOfWeek: 'Sun', dayName: 'Sunday', date: '2026-09-20', recipeId: 'rec-3', recipeName: 'Roasted Veggie Grain Bowl', assignedTo: 'Together', isLocked: false, isLeftoverOrOut: false }
    ];

    // State
    let appState = {
      activeTab: 'plan',
      activeUser: 'Husband',
      recipes: DEFAULT_RECIPES,
      pantry: DEFAULT_PANTRY,
      mealPlan: DEFAULT_PLAN,
      selectedDayIndex: 2,
      scriptUrl: '',
      recipeFilterTag: 'ALL RECIPES',
      recipeSearchQuery: '',
      grocerySubtab: 'shopping',
      showInStockInGrocery: false
    };

    // Load Local Storage
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        appState = { ...appState, ...parsed };
      }
    } catch(e) {}

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch(e) {}
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3000);
    }

    // Switch active user
    function switchUser(role) {
      appState.activeUser = role;
      document.getElementById('btn-husband').className = 'user-btn ' + (role === 'Husband' ? 'active' : '');
      document.getElementById('btn-wife').className = 'user-btn ' + (role === 'Wife' ? 'active' : '');
      saveState();
      renderActiveTab();
    }

    // Tab switching
    function setTab(tab) {
      appState.activeTab = tab;
      const navItems = document.querySelectorAll('.nav-item');
      const tabs = ['plan', 'recipes', 'groceries', 'stats'];
      navItems.forEach((btn, i) => {
        btn.className = 'nav-item ' + (tabs[i] === tab ? 'active' : '');
      });
      document.querySelectorAll('.tab-view').forEach(el => el.style.display = 'none');
      document.getElementById('tab-content-' + tab).style.display = 'block';
      renderActiveTab();
    }

    function renderActiveTab() {
      if (appState.activeTab === 'plan') renderPlanTab();
      else if (appState.activeTab === 'recipes') renderRecipesTab();
      else if (appState.activeTab === 'groceries') renderGroceriesTab();
      else if (appState.activeTab === 'stats') renderStatsTab();
    }

    // --- 1. PLAN TAB RENDER ---
    function renderPlanTab() {
      const el = document.getElementById('tab-content-plan');
      const day = appState.mealPlan[appState.selectedDayIndex] || appState.mealPlan[0];
      const recipe = appState.recipes.find(r => r.id === day.recipeId);

      let dayBoxesHtml = '';
      appState.mealPlan.forEach((d, idx) => {
        const isSel = idx === appState.selectedDayIndex;
        dayBoxesHtml += `
          <button class="day-box ${isSel ? 'active' : ''}" onclick="selectDay(${idx})">
            <span>${d.dayOfWeek.charAt(0)}</span>
            <div class="meal-dot-bar"></div>
            <span style="font-size: 8px;">${d.isLocked ? '🔒' : '•'}</span>
          </button>
        `;
      });

      el.innerHTML = `
        <div class="day-selector-grid">${dayBoxesHtml}</div>

        <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px;">
          <div>
            <h2 class="serif" style="font-size: 28px; font-weight: 700;">${day.dayName}</h2>
            <span style="font-size: 11px; color: var(--text-muted);">${day.date}</span>
          </div>
          <span style="font-size: 11px; font-weight: 700; background: white; border: 1px solid var(--border-color); padding: 4px 10px; border-radius: 9999px;">
            🔥 ${recipe ? recipe.calories || 480 : 450} kcal
          </span>
        </div>

        <div class="card" style="margin-bottom: 20px;">
          ${recipe ? `
            <div class="meal-hero-header" onclick="openRecipeDetail('${recipe.id}')" style="cursor: pointer;">
              <img src="${recipe.imageUrl}" alt="${recipe.name}" class="meal-hero-img">
              <div class="meal-tags-float">
                <span class="float-badge">${recipe.cookTimeMins} MIN</span>
                <span class="float-badge">${recipe.tags[0] || 'DINNER'}</span>
              </div>
              <div class="img-overlay-bottom">
                <h3 class="serif" style="font-size: 20px; font-weight: 700;">${recipe.name}</h3>
              </div>
            </div>
            <div style="padding: 14px; display: flex; justify-content: space-between; align-items: center;">
              <div style="font-size: 11px; color: var(--text-muted);">
                🧔 ${recipe.ratingHusband}★ | 👩 ${recipe.ratingWife}★
              </div>
              <div style="display: flex; gap: 4px;">
                <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 10px;" onclick="toggleLock(${appState.selectedDayIndex})">
                  ${day.isLocked ? '🔒 Locked' : '🔓 Lock'}
                </button>
                <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 10px;" onclick="rerollDay(${appState.selectedDayIndex})">
                  🔄 Reroll
                </button>
              </div>
            </div>
          ` : `
            <div style="padding: 30px; text-align: center;">
              <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 10px;">No recipe assigned.</p>
              <button class="btn btn-primary" onclick="rerollDay(${appState.selectedDayIndex})">Auto Pick Recipe</button>
            </div>
          `}
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px;">
          <button class="btn btn-secondary" onclick="autoGeneratePlan()">✨ Auto-Generate Plan</button>
          <button class="btn btn-primary" onclick="exportICSCalendar()">📅 Export to Calendar (.ics)</button>
        </div>
      `;
    }

    function selectDay(idx) {
      appState.selectedDayIndex = idx;
      renderPlanTab();
    }

    function toggleLock(idx) {
      appState.mealPlan[idx].isLocked = !appState.mealPlan[idx].isLocked;
      saveState();
      renderPlanTab();
      showToast(appState.mealPlan[idx].isLocked ? 'Day locked' : 'Day unlocked');
    }

    function rerollDay(idx) {
      const other = appState.recipes.filter(r => r.id !== appState.mealPlan[idx].recipeId);
      if (other.length) {
        const picked = other[Math.floor(Math.random() * other.length)];
        appState.mealPlan[idx].recipeId = picked.id;
        appState.mealPlan[idx].recipeName = picked.name;
        saveState();
        renderPlanTab();
        showToast('Swapped to ' + picked.name);
      }
    }

    function autoGeneratePlan() {
      appState.mealPlan.forEach(d => {
        if (!d.isLocked) {
          const r = appState.recipes[Math.floor(Math.random() * appState.recipes.length)];
          d.recipeId = r.id;
          d.recipeName = r.name;
        }
      });
      saveState();
      renderPlanTab();
      showToast('Plan auto-generated with top rated & pantry items!');
    }

    // Calendar Export (.ics)
    function exportICSCalendar() {
      let lines = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Mise//Meal Planner//EN',
        'CALSCALE:GREGORIAN'
      ];
      appState.mealPlan.forEach((d, i) => {
        const r = appState.recipes.find(rec => rec.id === d.recipeId);
        const name = r ? r.name : 'Dinner';
        const dateStr = d.date.replace(/-/g, '');
        lines.push('BEGIN:VEVENT');
        lines.push(`UID:mise-${d.dayOfWeek}-${i}-${Date.now()}@mise.app`);
        lines.push(`DTSTART:${dateStr}T183000Z`);
        lines.push(`DTEND:${dateStr}T193000Z`);
        lines.push(`SUMMARY:Dinner: ${name}`);
        lines.push(`DESCRIPTION:Cook: ${d.assignedTo} | Open recipe: ${window.location.origin}/#recipe=${d.recipeId}`);
        lines.push(`URL:${window.location.origin}/#recipe=${d.recipeId}`);
        lines.push('END:VEVENT');
      });
      lines.push('END:VCALENDAR');
      const blob = new Blob([lines.join('\\r\\n')], { type: 'text/calendar;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'mise-weekly-meal-plan.ics';
      a.click();
      showToast('Calendar (.ics) downloaded!');
    }

    // --- 2. RECIPES TAB RENDER ---
    function renderRecipesTab() {
      const el = document.getElementById('tab-content-recipes');
      const chips = ['ALL RECIPES', 'QUICK < 30 MIN', 'HIGH-PROTEIN', 'VEGETARIAN', 'SEAFOOD'];

      let chipsHtml = chips.map(c => `
        <button class="pill-chip ${appState.recipeFilterTag === c ? 'active' : ''}" onclick="setRecipeTag('${c}')">
          ${c}
        </button>
      `).join('');

      const filtered = appState.recipes.filter(r => {
        if (appState.recipeFilterTag !== 'ALL RECIPES' && !r.tags.includes(appState.recipeFilterTag)) return false;
        if (appState.recipeSearchQuery) {
          const q = appState.recipeSearchQuery.toLowerCase();
          return r.name.toLowerCase().includes(q) || r.ingredients.toLowerCase().includes(q);
        }
        return true;
      });

      let gridHtml = filtered.map(r => `
        <div class="recipe-card" onclick="openRecipeDetail('${r.id}')">
          <img src="${r.imageUrl}" alt="${r.name}" class="recipe-card-img">
          <div class="recipe-card-body">
            <h4 class="serif recipe-card-title">${r.name}</h4>
            <span class="tag-badge">${r.tags[0] || 'FAVORITE'}</span>
            <div style="display: flex; justify-content: space-between; font-size: 10px; color: #A09F99; border-top: 1px solid #333; padding-top: 4px;">
              <span>🧔 ${r.ratingHusband}★</span>
              <span>👩 ${r.ratingWife}★</span>
            </div>
          </div>
        </div>
      `).join('');

      el.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <div>
            <h2 class="serif" style="font-size: 28px; font-weight: 700;">Recipes</h2>
            <span style="font-size: 11px; color: var(--text-muted);">${appState.recipes.length} dishes in collection</span>
          </div>
          <button class="btn btn-primary" style="padding: 6px 12px; font-size: 11px;" onclick="openRecipeEditModal()">+ New Recipe</button>
        </div>

        <input type="text" placeholder="Search recipes or ingredients..." value="${appState.recipeSearchQuery}" oninput="searchRecipes(this.value)" style="width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border-color); font-size: 12px; margin-bottom: 12px; background: white;">

        <div style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 14px;">
          ${chipsHtml}
        </div>

        <div class="recipe-grid">${gridHtml}</div>
      `;
    }

    function setRecipeTag(tag) {
      appState.recipeFilterTag = tag;
      renderRecipesTab();
    }

    function searchRecipes(query) {
      appState.recipeSearchQuery = query;
      renderRecipesTab();
    }

    // --- 3. GROCERIES TAB RENDER ---

      const el = document.getElementById('tab-content-groceries');
      el.innerHTML = `

        <span style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 14px;">Aisle grouped ingredients for this week</span>

        <div class="card" style="padding: 14px;">
          <h3 style="font-size: 13px; font-weight: 700; color: var(--accent-green); margin-bottom: 10px;">PRODUCE</h3>
          <label style="display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 6px 0;"><input type="checkbox"> 1 Lemon, zested & juiced</label>

          <label style="display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 6px 0;"><input type="checkbox"> 2 cups Arugula</label>

          <label style="display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 6px 0;"><input type="checkbox"> 2 Salmon Fillets (6oz)</label>
          <label style="display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 6px 0;"><input type="checkbox"> 1 lb Raw Shrimp</label>

        <div class="card" style="padding: 14px;">
          <h3 style="font-size: 13px; font-weight: 700; color: var(--accent-green); margin-bottom: 10px;">PANTRY STAPLES & DAIRY</h3>

    function renderStatsTab() {

        <span style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 14px;">Ratings, duty sharing & meal history</span>

          <div style="display: flex; flex-direction: column; gap: 8px; font-size: 12px;">
            <div style="display: flex; justify-content: space-between; padding: 8px; background: #F9F8F3; border-radius: 8px;">

    // --- MODAL HANDLERS ---
    function openRecipeDetail(id) {
      const r = appState.recipes.find(rec => rec.id === id);
      if (!r) return;
      const modal = document.getElementById('modal-container');
      modal.style.display = 'flex';
      modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="modal-sheet">
          <div style="position: relative;">
            <img src="${r.imageUrl}" style="width: 100%; height: 220px; object-fit: cover;">
            <button onclick="closeModal()" style="position: absolute; top: 12px; left: 12px; border: none; background: white; border-radius: 50%; width: 32px; height: 32px; font-size: 16px; cursor: pointer;">✕</button>
          </div>
          <div style="padding: 18px;">
            <h2 class="serif" style="font-size: 24px; font-weight: 700; margin-bottom: 8px;">${r.name}</h2>

              <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600;">
                <span>🧔 Husband: ${r.ratingHusband} / 5 ★</span>
                <span>👩 Wife: ${r.ratingWife} / 5 ★</span>
              </div>
            </div>
            <h4 class="serif" style="font-size: 16px; font-weight: 700; margin-bottom: 6px;">Ingredients</h4>
            <div style="font-size: 12px; line-height: 1.6; margin-bottom: 14px; background: white; border: 1px solid var(--border-color); border-radius: 12px; padding: 10px;">
              ${r.ingredients}
            </div>
            <h4 class="serif" style="font-size: 16px; font-weight: 700; margin-bottom: 6px;">Instructions</h4>
            <div style="font-size: 12px; line-height: 1.6; white-space: pre-line; background: white; border: 1px solid var(--border-color); border-radius: 12px; padding: 10px; margin-bottom: 16px;">
              ${r.instructions}
            </div>
            <button class="btn btn-primary" style="width: 100%;" onclick="closeModal()">Close</button>
          </div>
        </div>
      `;
    }

    function closeModal() {
      document.getElementById('modal-container').style.display = 'none';
    }

    function openRecipeEditModal() {
      const name = prompt('Recipe Name:');
      if (name) {
        const newRec = {
          id: 'rec-' + Date.now(),
          name: name,
          ingredients: 'Salt, Pepper, Olive Oil',
          instructions: '1. Cook with care and serve fresh.',
          cookTimeMins: 25,
          ratingHusband: 4,
          ratingWife: 4,
          tags: ['QUICK < 30 MIN'],
          notes: 'Added from quick create.',
          imageUrl: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=800&auto=format&fit=crop&q=80',
          calories: 450,
          servings: 2,
          createdBy: appState.activeUser,
          lastEditedBy: appState.activeUser
        };
        appState.recipes.unshift(newRec);
        saveState();
        renderRecipesTab();
        showToast('Recipe added!');
      }
    }

    function openSettingsModal() {
      alert('Mise runs in zero-latency offline local-first mode with automatic background Google Apps Script sync capability.');
    }

    // Initial render
    setTab('plan');
  </script>
